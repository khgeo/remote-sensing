<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="30" width="380" height="284" rx="6" style="fill:#fbfbfb;stroke:#e0e0e0"/><circle cx="70" cy="72" r="22" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" opacity="1"/><text class="km-xs" x="70" y="112" text-anchor="middle">ព្រះអាទិត្យ</text><rect class="" x="36" y="140" width="348" height="34" rx="4" style="fill:rgba(129,212,250,.35);stroke:#4fc3f7"/><text class="km-xs" x="48" y="162" text-anchor="start" style="fill:#0277bd">បរិយាកាស៖ ស្រូប · ខ្ចាត់ខ្ចាយ · ពពក</text><rect class="" x="36" y="222" width="348" height="44" rx="4" style="fill:#e8f5e9;stroke:#a5d6a7"/><text class="km-xs" x="48" y="240" text-anchor="start" style="fill:#2e7d32">ផ្ទៃដី៖ ព្រៃ ស្រែ ទឹក អគារ ដី</text><text class="km-xs" x="48" y="258" text-anchor="start" style="fill:#2e7d32">វត្ថុនីមួយៗចាំងផ្លាតខុសគ្នា</text><rect class="" x="300" y="52" width="84" height="40" rx="5" style="fill:#eceff1;stroke:#78909c"/><text class="km-xs" x="342" y="77" text-anchor="middle" font-weight="700">ផ្កាយរណប</text><line class="km-arr" x1="86" y1="96" x2="190" y2="218"/><text class="km-xs" x="120" y="126" text-anchor="start" style="fill:#f57f17">① រលកចុះ</text><line class="km-arr" x1="215" y1="218" x2="305" y2="96"/><text class="km-xs" x="258" y="206" text-anchor="start" style="fill:#e65100">② ចាំងផ្លាត</text><text class="km-xs" x="210" y="298" text-anchor="middle">③ ឧបករណ៍ចាប់សញ្ញាវាស់ថាមពលក្នុងក្រុមរលកនីមួយៗ</text><rect class="km-box" x="430" y="40" width="300" height="52" rx="6"/><rect class="km-hdr" x="430" y="40" width="300" height="26" rx="6"/><text class="km-s" x="580.0" y="58" text-anchor="middle" font-weight="700">④ ទិន្នន័យឆៅ</text><text class="km-xs" x="580.0" y="86" text-anchor="middle">តម្លៃលេខ (DN) ក្នុងក្រឡា</text><line class="km-arr" x1="580" y1="94" x2="580" y2="104"/><rect class="km-box" x="430" y="106" width="300" height="52" rx="6"/><rect class="km-hdr" x="430" y="106" width="300" height="26" rx="6"/><text class="km-s" x="580.0" y="124" text-anchor="middle" font-weight="700">⑤ ការកែតម្រូវ</text><text class="km-xs" x="580.0" y="152" text-anchor="middle">DN → ការចាំងផ្លាតផ្ទៃ</text><line class="km-arr" x1="580" y1="160" x2="580" y2="170"/><rect class="km-box" x="430" y="172" width="300" height="52" rx="6"/><rect class="km-hdr" x="430" y="172" width="300" height="26" rx="6"/><text class="km-s" x="580.0" y="190" text-anchor="middle" font-weight="700">⑥ ការវិភាគ</text><text class="km-xs" x="580.0" y="218" text-anchor="middle">សន្ទស្សន៍ · ការចាត់ថ្នាក់</text><line class="km-arr" x1="580" y1="226" x2="580" y2="236"/><rect class="km-box" x="430" y="238" width="300" height="52" rx="6"/><rect class="km-hdr" x="430" y="238" width="300" height="26" rx="6"/><text class="km-s" x="580.0" y="256" text-anchor="middle" font-weight="700">⑦ ព័ត៌មាន</text><text class="km-xs" x="580.0" y="284" text-anchor="middle">ផែនទី និងតួលេខសម្រាប់សម្រេចចិត្ត</text></svg>
