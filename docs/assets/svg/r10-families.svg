<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="20" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#2e7d32"/><text class="km-s" x="36" y="48" text-anchor="start" style="fill:#2e7d32" font-weight="700">រុក្ខជាតិ</text><text class="km-xs" x="36" y="70" text-anchor="start">NDVI · EVI · SAVI</text><text class="km-xs" x="36" y="100" text-anchor="start" style="fill:#555">(NIR − Red) / (NIR + Red)</text><rect class="" x="400" y="20" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#1565c0"/><text class="km-s" x="416" y="48" text-anchor="start" style="fill:#1565c0" font-weight="700">ទឹក</text><text class="km-xs" x="416" y="70" text-anchor="start">NDWI · MNDWI</text><text class="km-xs" x="416" y="100" text-anchor="start" style="fill:#555">(Green − NIR) / (Green + NIR)</text><rect class="" x="20" y="160" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#6d4c41"/><text class="km-s" x="36" y="188" text-anchor="start" style="fill:#6d4c41" font-weight="700">ដី និងសំណង់</text><text class="km-xs" x="36" y="210" text-anchor="start">NDBI · BSI</text><text class="km-xs" x="36" y="240" text-anchor="start" style="fill:#555">(SWIR − NIR) / (SWIR + NIR)</text><rect class="" x="400" y="160" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#e65100"/><text class="km-s" x="416" y="188" text-anchor="start" style="fill:#e65100" font-weight="700">ភ្លើងឆេះ</text><text class="km-xs" x="416" y="210" text-anchor="start">NBR</text><text class="km-xs" x="416" y="240" text-anchor="start" style="fill:#555">(NIR − SWIR2) / (NIR + SWIR2)</text></svg>
