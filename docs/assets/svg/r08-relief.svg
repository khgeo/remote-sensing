<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><text class="km-t" x="20" y="24" text-anchor="start">ហេតុអ្វីជម្រាលភូមិសាស្ត្រធ្វើឲ្យទីតាំងខូច</text><rect class="" x="350" y="36" width="60" height="26" rx="4" style="fill:#eceff1;stroke:#78909c"/><text class="km-xs" x="380" y="54" text-anchor="middle">ឧបករណ៍ចាប់</text><line class="" x1="60" y1="220" x2="700" y2="220" style="stroke:#8d6e63;stroke-width:2"/><path d="M300 220 L340 150 L400 130 L460 170 L500 220 Z" fill="#a1887f" stroke="#6d4c41" stroke-width="1.5" opacity="1"/><line class="" x1="380" y1="50" x2="400" y2="130" style="stroke:#2e7d32;stroke-width:1.6;stroke-dasharray:2 2"/><circle cx="400" cy="130" r="5" fill="#2e7d32" stroke="none" stroke-width="1.5" opacity="1"/><text class="km-xs" x="390" y="120" text-anchor="start" style="fill:#2e7d32">ទីតាំងពិត (លើកំពូល)</text><line class="" x1="400" y1="130" x2="422.5" y2="220" style="stroke:#c62828;stroke-width:1.6;stroke-dasharray:4 3"/><circle cx="422.5" cy="220" r="5" fill="#c62828" stroke="none" stroke-width="1.5" opacity="1"/><text class="km-xs" x="430.5" y="214" text-anchor="start" style="fill:#c62828">ទីតាំងលេចមក (relief displacement)</text><text class="km-s" x="60" y="260" text-anchor="start">ចំណុចខ្ពស់លេចមកឆ្ងាយពីចំណុចកណ្ដាលរូបភាព ច្រើនជាងចំណុចទាប</text><text class="km-s" x="60" y="282" text-anchor="start">DEM ត្រូវការដើម្បីកែផលនេះ (ការកែតម្រូវអូតូ · Orthorectification)</text></svg>
