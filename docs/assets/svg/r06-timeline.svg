<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="62.66666666666667" y="30" width="124.66666666666667" height="16" rx="3" style="fill:#8d6e63"/><text class="km-xs" x="56.66666666666667" y="42" text-anchor="end">Landsat 1-3</text><rect class="" x="176.0" y="60" width="351.33333333333326" height="16" rx="3" style="fill:#6d4c41"/><text class="km-xs" x="170.0" y="72" text-anchor="end">Landsat 4-5</text><rect class="" x="368.6666666666667" y="90" width="283.3333333333333" height="16" rx="3" style="fill:#5d4037"/><text class="km-xs" x="362.6666666666667" y="102" text-anchor="end">Landsat 7</text><rect class="" x="527.3333333333333" y="120" width="192.66666666666674" height="16" rx="3" style="fill:#4e342e"/><text class="km-xs" x="521.3333333333333" y="132" text-anchor="end">Landsat 8-9</text><rect class="" x="368.6666666666667" y="150" width="351.3333333333333" height="16" rx="3" style="fill:#2e7d32"/><text class="km-xs" x="362.6666666666667" y="162" text-anchor="end">MODIS (Terra/Aqua