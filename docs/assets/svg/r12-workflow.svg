<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="60" width="170" height="90" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="105" y="95" text-anchor="middle" font-weight="700">១. យកគំរូ</text><text class="km-s" x="105" y="115" text-anchor="middle">(Training samples)</text><line class="" x1="190" y1="105" x2="210" y2="105" style="stroke:#5c6bc0;stroke-width:2"/><rect class="" x="210" y="60" width="170" height="90" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="295" y="95" text-anchor="middle" font-weight="700">២. គណនាហត្ថលេខា</text><text class="km-s" x="295" y="115" text-anchor="middle">សម្រាប់ថ្នាក់នីមួយៗ</text><line class="" x1="380" y1="105" x2="400" y2="105" style="stroke:#5c6bc0;stroke-width:2"/><rect class="" x="400" y="60" width="170" height="90" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="485" y="95" text-anchor="middle" font-weight="700">៣. ចាត់ថ្នាក់ក្រឡា</text><text class="km-s" x="485" y="115" text-anchor="middle">ទាំងអស់</text><line class="" x1="570" y1="105" x2="590" y2="105" style="stroke:#5c6bc0;stroke-width:2"/><rect class="" x="590" y="60" width="170" height="90" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="675" y="95" text-anchor="middle" font-weight="700">៤. វាយតម្លៃ</text><text class="km-s" x="675" y="115" text-anchor="middle">ភាពត្រឹមត្រូវ</text><text class="km-s" x="20" y="190" text-anchor="start">ផ្ទុយពីការចាត់ថ្នាក់គ្មានការណែនាំ ដែលចាប់ផ្ដើមពីទិន្នន័យ វិធីនេះចាប់ផ្ដើមពីចំណេះដឹងរបស់មនុស្ស</text></svg>
