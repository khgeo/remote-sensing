<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 360" font-family="Battambang, Siemreap, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#5d4037" text-anchor="start" font-weight="bold" class="ftitle">សមីការកែតម្រូវរ៉ាដ្យូម៉ែត្រ</text><rect x="30.0" y="110.0" width="221.5" height="120.0" rx="12" fill="#bcaaa4" stroke="none" stroke-width="1" /><text x="140.8" y="164.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >DN</text><text x="140.8" y="190.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >តម្លៃលេខដើម</text><line x1="252.5" y1="170.0" x2="267.5" y2="170.0" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="269.5" y="110.0" width="221.5" height="120.0" rx="12" fill="#a1887f" stroke="none" stroke-width="1" /><text x="380.2" y="164.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ρ&#x27; = M·DN + A</text><text x="380.2" y="190.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >TOA គ្មានមុំ</text><line x1="492.0" y1="170.0" x2="507.0" y2="170.0" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="509.0" y="110.0" width="221.5" height="120.0" rx="12" fill="#8d6e63" stroke="none" stroke-width="1" /><text x="619.8" y="164.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ρ = ρ&#x27; / sin θ</text><text x="619.8" y="190.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >កែមុំព្រះអាទិត្យ</text><line x1="731.5" y1="170.0" x2="746.5" y2="170.0" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="748.5" y="110.0" width="221.5" height="120.0" rx="12" fill="#6d4c41" stroke="none" stroke-width="1" /><text x="859.2" y="164.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ρs = ρ − ρ_dark</text><text x="859.2" y="190.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >DOS</text><text x="500.0" y="300.0" font-size="16" fill="#607d8b" text-anchor="middle" font-weight="normal" >M = 2·10⁻⁵ · A = −0,1 · θ = ៥១,៥៦° (ពីឯកសារ MTL)</text></svg>