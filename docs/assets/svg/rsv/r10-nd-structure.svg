<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 400" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#5d4037" text-anchor="start" font-weight="bold" class="ftitle">រចនាសម្ព័ន្ធ Normalized Difference</text><text x="500.0" y="150.0" font-size="34" fill="#5d4037" text-anchor="middle" font-weight="bold" >ND = (A − B) / (A + B)</text><rect x="120.0" y="200.0" width="240.0" height="130.0" rx="10" fill="#faf6f4" stroke="none" stroke-width="1" /><text x="240.0" y="235.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold" >រុក្ខជាតិ</text><text x="240.0" y="270.0" font-size="14" fill="#607d8b" text-anchor="middle" font-weight="normal" >NIR ០.៤៥ · Red ០.០៥</text><text x="240.0" y="310.0" font-size="20" fill="#e64a19" text-anchor="middle" font-weight="bold" >NDVI = ០.៨</text><rect x="400.0" y="200.0" width="240.0" height="130.0" rx="10" fill="#faf6f4" stroke="none" stroke-width="1" /><text x="520.0" y="235.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold" >ទឹក</text><text x="520.0" y="270.0" font-size="14" fill="#607d8b" text-anchor="middle" font-weight="normal" >NIR ០.០២ · Red ០.០៥</text><text x="520.0" y="310.0" font-size="20" fill="#e64a19" text-anchor="middle" font-weight="bold" >NDVI = -០.៤៣</text><rect x="680.0" y="200.0" width="240.0" height="130.0" rx="10" fill="#faf6f4" stroke="none" stroke-width="1" /><text x="800.0" y="235.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold" >សំណង់</text><text x="800.0" y="270.0" font-size="14" fill="#607d8b" text-anchor="middle" font-weight="normal" >NIR ០.២២ · Red ០.១៨</text><text x="800.0" y="310.0" font-size="20" fill="#e64a19" text-anchor="middle" font-weight="bold" >NDVI = ០.១</text></svg>