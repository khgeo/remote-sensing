<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#5d4037" text-anchor="start" font-weight="bold" class="ftitle">អ្វីដែលការយកព័ត៌មានពីចម្ងាយអាច និងមិនអាច</text><rect x="40.0" y="90.0" width="440.0" height="310.0" rx="12" fill="#e8f5e9" stroke="#81c784" stroke-width="2" /><text x="260.0" y="125.0" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓ អាច</text><text x="70.0" y="170.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ផែនទីគម្របដី និងការផ្លាស់ប្ដូរ</text><text x="70.0" y="214.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• វាស់ផ្ទៃទឹកជំនន់</text><text x="70.0" y="258.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• តាមដានសុខភាពដំណាំ (NDVI)</text><text x="70.0" y="302.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• វាស់សីតុណ្ហភាពផ្ទៃ</text><text x="70.0" y="346.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• គ្របតំបន់ធំ ម្ដងទៀតៗ</text><rect x="520.0" y="90.0" width="440.0" height="310.0" rx="12" fill="#ffebee" stroke="#e57373" stroke-width="2" /><text x="740.0" y="125.0" font-size="22" fill="#c62828" text-anchor="middle" font-weight="bold" >✗ មិនអាចផ្ទាល់</text><text x="550.0" y="170.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ម្ចាស់ដី ឬការប្រើប្រាស់ផ្លូវច្បាប់</text><text x="550.0" y="214.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ប្រភេទពូជស្រូវច្បាស់លាស់</text><text x="550.0" y="258.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• វត្ថុតូចជាងក្រឡា</text><text x="550.0" y="302.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• អ្វីនៅក្រោមដី ឬក្រោមពពកក្រាស់</text><text x="550.0" y="346.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• មូលហេតុនៃការផ្លាស់ប្ដូរ</text></svg>