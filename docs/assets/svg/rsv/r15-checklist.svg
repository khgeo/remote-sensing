<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#5d4037" text-anchor="start" font-weight="bold" class="ftitle">បញ្ជីត្រួតពិនិត្យគម្រោងបញ្ចប់វគ្គ</text><rect x="80.0" y="95.0" width="28.0" height="28.0" rx="0" fill="#fff" stroke="#2e7d32" stroke-width="2" /><path d="M 85 109 l 6 7 l 12 -14" fill="none" stroke="#2e7d32" stroke-width="3" opacity="1" /><text x="125.0" y="117.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >សំណួរ និងតំបន់សិក្សាច្បាស់</text><rect x="80.0" y="147.0" width="28.0" height="28.0" rx="0" fill="#fff" stroke="#2e7d32" stroke-width="2" /><path d="M 85 161 l 6 7 l 12 -14" fill="none" stroke="#2e7d32" stroke-width="3" opacity="1" /><text x="125.0" y="169.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >រូបភាព ២ កាលបរិច្ឆេទ រដូវដូចគ្នា</text><rect x="80.0" y="199.0" width="28.0" height="28.0" rx="0" fill="#fff" stroke="#2e7d32" stroke-width="2" /><path d="M 85 213 l 6 7 l 12 -14" fill="none" stroke="#2e7d32" stroke-width="3" opacity="1" /><text x="125.0" y="221.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >កែតម្រូវរ៉ាដ្យូម៉ែត្រ និងពិនិត្យការត្រួតគ្នា</text><rect x="80.0" y="251.0" width="28.0" height="28.0" rx="0" fill="#fff" stroke="#2e7d32" stroke-width="2" /><path d="M 85 265 l 6 7 l 12 -14" fill="none" stroke="#2e7d32" stroke-width="3" opacity="1" /><text x="125.0" y="273.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >សន្ទស្សន៍ ឬការចាត់ថ្នាក់ + ភាពត្រឹមត្រូវ</text><rect x="80.0" y="303.0" width="28.0" height="28.0" rx="0" fill="#fff" stroke="#2e7d32" stroke-width="2" /><path d="M 85 317 l 6 7 l 12 -14" fill="none" stroke="#2e7d32" stroke-width="3" opacity="1" /><text x="125.0" y="325.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >ផែនទីការផ្លាស់ប្ដូរ និងផ្ទៃ (ហិកតា)</text><rect x="80.0" y="355.0" width="28.0" height="28.0" rx="0" fill="#fff" stroke="#2e7d32" stroke-width="2" /><path d="M 85 369 l 6 7 l 12 -14" fill="none" stroke="#2e7d32" stroke-width="3" opacity="1" /><text x="125.0" y="377.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >ដែនកំណត់ និងប្រភពទិន្នន័យ</text></svg>