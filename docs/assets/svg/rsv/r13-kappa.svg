<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="380" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#5d4037" text-anchor="start" font-weight="bold" class="ftitle">គណនា Kappa</text><text x="500.0" y="140.0" font-size="32" fill="#5d4037" text-anchor="middle" font-weight="bold" >K̂ = (Pₒ − Pₑ) / (1 − Pₑ)</text><text x="500.0" y="200.0" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal" >Pₒ = ភាពត្រឹមត្រូវសរុប · Pₑ = ភាពត្រូវគ្នាដោយចៃដន្យ = Σ (ផលបូកជួរដេក × ផលបូកជួរឈរ) / N²</text><rect x="100.0" y="250.0" width="185.0" height="70.0" rx="10" fill="#e57373" stroke="none" stroke-width="1" /><text x="192.0" y="280.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >&lt; ០,៤</text><text x="192.0" y="306.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >ខ្សោយ</text><rect x="305.0" y="250.0" width="185.0" height="70.0" rx="10" fill="#ffb74d" stroke="none" stroke-width="1" /><text x="397.0" y="280.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >០,៤–០,៦</text><text x="397.0" y="306.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >មធ្យម</text><rect x="510.0" y="250.0" width="185.0" height="70.0" rx="10" fill="#aed581" stroke="none" stroke-width="1" /><text x="602.0" y="280.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >០,៦–០,៨</text><text x="602.0" y="306.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >ល្អ</text><rect x="715.0" y="250.0" width="185.0" height="70.0" rx="10" fill="#43a047" stroke="none" stroke-width="1" /><text x="807.0" y="280.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >&gt; ០,៨</text><text x="807.0" y="306.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >ល្អណាស់</text></svg>