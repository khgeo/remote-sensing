<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><text class="km-xs" x="30" y="24" text-anchor="start" font-weight="700">វេទិកា</text><text class="km-xs" x="200" y="24" text-anchor="start" font-weight="700">កម្ពស់</text><text class="km-xs" x="320" y="24" text-anchor="start" font-weight="700">ទំហំក្រឡាធម្មតា</text><text class="km-xs" x="470" y="24" text-anchor="start" font-weight="700">ការប្រើប្រាស់</text><line class="" x1="120" y1="52" x2="740" y2="52" style="stroke:#eceff1;stroke-width:1"/><circle cx="120" cy="52" r="6" fill="#5d4037" stroke="#fff" stroke-width="1.5" opacity="1"/><text class="km-s" x="112" y="56" text-anchor="end" font-weight="700">ផ្កាយរណបឋិតិវន្ត</text><text class="km-s" x="200" y="56" text-anchor="start" style="fill:#5d4037">៣៥ ៧៨៦ គម</text><text class="km-xs" x="320" y="56" text-anchor="start">≥ ៥០០ ម</text><text class="km-xs" x="470" y="56" text-anchor="start">អាកាសធាតុ · រៀងរាល់ ១០ នាទី</text><line class="" x1="120" y1="96" x2="740" y2="96" style="stroke:#eceff1;stroke-width:1"/><circle cx="120" cy="96" r="6" fill="#5d4037" stroke="#fff" stroke-width="1.5" opacity="1"/><text class="km-s" x="112" y="100" text-anchor="end" font-weight="700">MODIS · VIIRS</text><text class="km-s" x="200" y="100" text-anchor="start" style="fill:#5d4037">៧០៥ ទៅ ៨៣៤ គម</text><text class="km-xs" x="320" y="100" text-anchor="start">២៥០ ម ទៅ ១ គម</text><text class="km-xs" x="470" y="100" text-anchor="start">ទទឹងថត &gt;២ ០០០ គម · ប្រចាំថ្ងៃ</text><line class="" x1="120" y1="140" x2="740" y2="140" style="stroke:#eceff1;stroke-width:1"/><circle cx="120" cy="140" r="6" fill="#5d4037" stroke="#fff" stroke-width="1.5" opacity="1"/><text class="km-s" x="112" y="144" text-anchor="end" font-weight="700">Sentinel-2</text><text class="km-s" x="200" y="144" text-anchor="start" style="fill:#5d4037">៧៨៦ គម</text><text class="km-xs" x="320" y="144" text-anchor="start">១០ ទៅ ៦០ ម</text><text class="km-xs" x="470" y="144" text-anchor="start">ទទឹងថត ២៩០ គម · ៥ ថ្ងៃ</text><line class="" x1="120" y1="184" x2="740" y2="184" style="stroke:#eceff1;stroke-width:1"/><circle cx="120" cy="184" r="6" fill="#5d4037" stroke="#fff" stroke-width="1.5" opacity="1"/><text class="km-s" x="112" y="188" text-anchor="end" font-weight="700">Landsat 8/9</text><text class="km-s" x="200" y="188" text-anchor="start" style="fill:#5d4037">៧០៥ គម</text><text class="km-xs" x="320" y="188" text-anchor="start">១៥ ទៅ ១០០ ម</text><text class="km-xs" x="470" y="188" text-anchor="start">ទទឹងថត ១៨៥ គម · ១៦ ថ្ងៃ</text><line class="" x1="120" y1="228" x2="740" y2="228" style="stroke:#eceff1;stroke-width:1"/><circle cx="120" cy="228" r="6" fill="#5d4037" stroke="#fff" stroke-width="1.5" opacity="1"/><text class="km-s" x="112" y="232" text-anchor="end" font-weight="700">យន្តហោះ</text><text class="km-s" x="200" y="232" text-anchor="start" style="fill:#5d4037">២ ទៅ ៥ គម</text><text class="km-xs" x="320" y="232" text-anchor="start">១០ ទៅ ៥០ សម</text><text class="km-xs" x="470" y="232" text-anchor="start">ការស្ទង់ផែនទី · LiDAR</text><line class="" x1="120" y1="272" x2="740" y2="272" style="stroke:#eceff1;stroke-width:1"/><circle cx="120" cy="272" r="6" fill="#5d4037" stroke="#fff" stroke-width="1.5" opacity="1"/><text class="km-s" x="112" y="276" text-anchor="end" font-weight="700">ដ្រូន</text><text class="km-s" x="200" y="276" text-anchor="start" style="fill:#5d4037">៥០ ទៅ ៤០០ ម</text><text class="km-xs" x="320" y="276" text-anchor="start">២ ទៅ ១០ សម</text><text class="km-xs" x="470" y="276" text-anchor="start">តំបន់តូច · តាមតម្រូវការ</text><line class="" x1="120" y1="40" x2="120" y2="330" style="stroke:#bdbdbd;stroke-dasharray:4 4"/><rect class="" x="20" y="336" width="720" height="26" rx="4" style="fill:#e8f5e9;stroke:#a5d6a7"/><text class="km-xs" x="32" y="354" text-anchor="start" style="fill:#2e7d32">ផ្ទៃដី</text><text class="km-xs" x="200" y="376" text-anchor="start">បញ្ជីតាមកម្ពស់ (មិនមែនតាមមាត្រដ្ឋាន) · តម្លៃជាតម្លៃប្រហាក់ប្រហែល</text></svg>
