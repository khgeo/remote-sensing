<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="90" width="170" height="90" rx="6" style="fill:#fafafa;stroke:#bdbdbd"/><text class="km-s" x="105" y="118" text-anchor="middle" font-weight="700">DN ឆៅ</text><text class="km-xs" x="105" y="140" text-anchor="middle">តម្លៃលេខពីឧបករណ៍ចាប់ (០–៤០</text><text class="km-xs" x="105" y="156" text-anchor="middle">៩៥ សម្រាប់ ១២ ប៊ីត)</text><line class="" x1="190" y1="135" x2="210" y2="135" style="stroke:#e65100;stroke-width:2"/><rect class="" x="210" y="90" width="170" height="90" rx="6" style="fill:#fafafa;stroke:#bdbdbd"/><text class="km-s" x="295" y="118" text-anchor="middle" font-weight="700">ការចាំងផ្លាត TOA</text><text class="km-xs" x="295" y="140" text-anchor="middle">DN × Gain + Offset · នៅតែម</text><text class="km-xs" x="295" y="156" text-anchor="middle">ានឥទ្ធិពលបរិយាកាស</text><line class="" x1="380" y1="135" x2="400" y2="135" style="stroke:#e65100;stroke-width:2"/><rect class="" x="400" y="90" width="170" height="90" rx="6" style="fill:#fafafa;stroke:#bdbdbd"/><text class="km-s" x="485" y="118" text-anchor="middle" font-weight="700">ការកែតម្រូវបរិយាកាស</text><text class="km-xs" x="485" y="140" text-anchor="middle">ដកពន្លឺផ្លូវ · កែតាមមុំព្រ</text><text class="km-xs" x="485" y="156" text-anchor="middle">ះអាទិត្យ · ការចាំងផ្លាត BOA</text><line class="" x1="570" y1="135" x2="590" y2="135" style="stroke:#e65100;stroke-width:2"/><rect class="" x="590" y="90" width="170" height="90" rx="6" style="fill:#fafafa;stroke:#bdbdbd"/><text class="km-s" x="675" y="118" text-anchor="middle" font-weight="700">ត្រៀមសម្រាប់វិភាគ</text><text class="km-xs" x="675" y="140" text-anchor="middle">សន្ទស្សន៍ · ការចាត់ថ្នាក់ </text><text class="km-xs" x="675" y="156" text-anchor="middle">· ការប្រៀបធៀបចម្រុះកាលបរិច្ឆេទ</text><text class="km-s" x="20" y="40" text-anchor="start">L1C = TOA (Sentinel-2) · L2A = BOA (Sentinel-2) · Collection 2 L1/L2 (Landsat)</text></svg>
