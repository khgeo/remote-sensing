<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="20" width="360" height="150" rx="8" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="36" y="48" text-anchor="start" font-weight="700">លំហ (Spatial)</text><text class="km-xs" x="36" y="70" text-anchor="start" style="fill:#555">ទំហំក្រឡានៅលើដី</text><text class="km-xs" x="36" y="98" text-anchor="start" font-weight="700">ការសម្របសម្រួល៖</text><text class="km-xs" x="36" y="118" text-anchor="start" style="fill:#555">តូច = លម្អិតច្រើន តែតំបន់តូច និងទិន្នន័យធំ</text><text class="km-xs" x="36" y="144" text-anchor="start" style="fill:#37474f">ឧទាហរណ៍៖ 10 ម · 30 ម · 250 ម</text><rect class="" x="400" y="20" width="360" height="150" rx="8" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="416" y="48" text-anchor="start" font-weight="700">ស្ពិចត្រាល់ (Spectral)</text><text class="km-xs" x="416" y="70" text-anchor="start" style="fill:#555">ចំនួន និងទទឹងក្រុមរលក</text><text class="km-xs" x="416" y="98" text-anchor="start" font-weight="700">ការសម្របសម្រួល៖</text><text class="km-xs" x="416" y="118" text-anchor="start" style="fill:#555">ច្រើន = បែងចែកវត្ថុបានល្អ តែថាមពលក្នុងក្រុមរលកនីមួយៗតិច</text><text class="km-xs" x="416" y="144" text-anchor="start" style="fill:#37474f">ឧទាហរណ៍៖ ៣ បញ្ចូលគ្នា · ១៣ ចង្អៀត · ២០០ (hyperspectral)</text><rect class="" x="20" y="185" width="360" height="150" rx="8" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="36" y="213" text-anchor="start" font-weight="700">រ៉ាដ្យូម៉ែត្រ (Radiometric)</text><text class="km-xs" x="36" y="235" text-anchor="start" style="fill:#555">ចំនួនកម្រិតតម្លៃដែលកត់ត្រាបាន</text><text class="km-xs" x="36" y="263" text-anchor="start" font-weight="700">ការសម្របសម្រួល៖</text><text class="km-xs" x="36" y="283" text-anchor="start" style="fill:#555">ច្រើន = បែងចែកភាពខុសគ្នាតូចៗបាន</text><text class="km-xs" x="36" y="309" text-anchor="start" style="fill:#37474f">ឧទាហរណ៍៖ ៨ ប៊ីត (២៥៦) · ១២ ប៊ីត (៤ ០៩៦)</text><rect class="" x="400" y="185" width="360" height="150" rx="8" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="416" y="213" text-anchor="start" font-weight="700">ពេលវេលា (Temporal)</text><text class="km-xs" x="416" y="235" text-anchor="start" style="fill:#555">ញឹកញាប់ថតឡើងវិញ</text><text class="km-xs" x="416" y="263" text-anchor="start" font-weight="700">ការសម្របសម្រួល៖</text><text class="km-xs" x="416" y="283" text-anchor="start" style="fill:#555">ញឹក = តាមដានការផ្លាស់ប្ដូរបាន តែជាធម្មតាត្រូវការទទឹងថតធំ</text><text class="km-xs" x="416" y="309" text-anchor="start" style="fill:#37474f">ឧទាហរណ៍៖ ៥ ថ្ងៃ (S2) · ១៦ ថ្ងៃ (Landsat)</text></svg>
