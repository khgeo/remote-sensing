<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="20" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="36" y="48" text-anchor="start" font-weight="700">ភាពខុសគ្នានៃរូបភាព</text><text class="km-xs" x="36" y="66" text-anchor="start" style="fill:#5c6bc0">Image Differencing</text><text class="km-xs" x="36" y="92" text-anchor="start">• ដក NDVI(ក្រោយ) − NDVI(មុន)</text><text class="km-xs" x="36" y="110" text-anchor="start">• សាមញ្ញ</text><text class="km-xs" x="36" y="128" text-anchor="start">• ត្រូវការកម្រិតកំណត់</text><rect class="" x="400" y="20" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="416" y="48" text-anchor="start" font-weight="700">ការចាត់ថ្នាក់ក្រោយពីរដង</text><text class="km-xs" x="416" y="66" text-anchor="start" style="fill:#5c6bc0">Post-classification Comparison</text><text class="km-xs" x="416" y="92" text-anchor="start">• ចាត់ថ្នាក់ដាច់ដោយឡែក ២ ដង</text><text class="km-xs" x="416" y="110" text-anchor="start">• ប្រៀបធៀបផែនទី</text><text class="km-xs" x="416" y="128" text-anchor="start">• ប្រាប់ពីអ្វី→អ្វី</text><rect class="" x="20" y="160" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="36" y="188" text-anchor="start" font-weight="700">ការវិភាគសមាសភាគសំខាន់</text><text class="km-xs" x="36" y="206" text-anchor="start" style="fill:#5c6bc0">PCA-based</text><text class="km-xs" x="36" y="232" text-anchor="start">• បង្រួមទិន្នន័យច្រើនកាលបរិច្ឆេទ</text><text class="km-xs" x="36" y="250" text-anchor="start">• រកសមាសភាគដែលបង្ហាញការប្រែប្រួល</text><rect class="" x="400" y="160" width="360" height="120" rx="8" style="fill:#fafafa;stroke:#5c6bc0"/><text class="km-s" x="416" y="188" text-anchor="start" font-weight="700">ស៊េរីពេលវេលា</text><text class="km-xs" x="416" y="206" text-anchor="start" style="fill:#5c6bc0">Time Series Analysis</text><text class="km-xs" x="416" y="232" text-anchor="start">• រូបភាពច្រើនចំណុច</text><text class="km-xs" x="416" y="250" text-anchor="start">• តាមដានទិសដៅ</text><text class="km-xs" x="416" y="268" text-anchor="start">• រកភាពមិនប្រក្រតី</text></svg>
