<!doctype html>
<!-- One simulation of this book on its own page, for questions in the Grading System.
     Address: sim.html?s=NAME  (NAME as in <div class="sim" data-sim="NAME"> in a lesson). -->
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Simulation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Siemreap&family=Moul&display=swap">
  <link rel="stylesheet" href="assets/css/khmer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/css/workbook.css">
  <link rel="stylesheet" href="assets/css/lesson-sims.css">
  <style>
    :root { --md-primary-fg-color:#1e5a8c; --md-accent-fg-color:#d9480f; --md-default-fg-color:rgba(0,0,0,.87);
      --md-default-fg-color--light:rgba(0,0,0,.54); --md-default-fg-color--lighter:rgba(0,0,0,.32); --md-default-fg-color--lightest:rgba(0,0,0,.07);
      --md-default-bg-color:#fff; --md-code-bg-color:#f5f5f5; --md-typeset-a-color:#1e5a8c; }
    html, body { margin:0; background:#fff; color:rgba(0,0,0,.87); font-family:Battambang, Siemreap, system-ui, sans-serif; font-size:15px; }
    main { padding:10px 12px; }
    .sim { margin:0 !important; }
    #missing { padding:16px; color:#b00020; }
  </style>
</head>
<body>
  <main class="md-typeset"><div class="sim" id="one"></div><div id="missing" hidden></div></main>
  <script>
    (function () {
      var s = new URLSearchParams(location.search).get("s") || "";
      if (!/^[\w-]+$/.test(s)) { document.getElementById("one").remove(); var m = document.getElementById("missing"); m.hidden = false; m.textContent = "Add ?s=NAME to the address (the simulation name)."; return; }
      document.getElementById("one").setAttribute("data-sim", s);
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/js/rs-sims.js"></script>
  <script src="assets/js/rs-report-sim.js"></script>
  <script src="assets/js/lesson-sims.js"></script>
  <script src="assets/js/workbook.js"></script>
</body>
</html>
